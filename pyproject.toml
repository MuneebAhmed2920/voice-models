[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clara-voice-model"
version = "1.0.0"
description = "Production Real-Time OmniVoice TTS Engine for Vicidial & AI Voice Bots (Windows NVIDIA CUDA FP16)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "OmniVoice Telephony Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "omnivoice>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
    "numpy>=1.24.0,<2.0.0",
    "num2words>=0.5.13",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["runtime*", "server*", "bridges*", "prompt*", "config*"]
